<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flutter Run</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a0a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
  }

  #game-wrapper {
    position: relative;
    width: 800px;
    max-width: 100vw;
  }

  #level-display {
    text-align: center;
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: #ffe066;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-shadow: 0 2px 8px rgba(255,224,102,0.4);
    height: 28px;
    transition: transform 0.2s;
  }

  #level-display.level-up {
    animation: levelPop 0.5s ease;
  }

  @keyframes levelPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.4); color: #ff9f43; }
    100% { transform: scale(1); }
  }

  #canvas {
    display: block;
    border-radius: 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }

  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
    font-family: 'Fredoka One', cursive;
    font-size: 16px;
    color: rgba(255,255,255,0.7);
  }

  #hud span { color: #ffe066; font-size: 18px; }

  #sound-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    color: white;
    font-size: 18px;
    width: 36px;
    height: 36px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  #sound-btn:hover { background: rgba(255,255,255,0.2); }

  #overlay {
    position: absolute;
    top: 36px;
    left: 0; right: 0; bottom: 0;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(15, 5, 30, 0.85);
    backdrop-filter: blur(4px);
    gap: 16px;
    transition: opacity 0.3s;
  }

  #overlay.hidden { display: none; }

  .overlay-title {
    font-family: 'Fredoka One', cursive;
    font-size: 52px;
    color: #ffe066;
    text-shadow: 0 4px 16px rgba(255,224,102,0.5);
    line-height: 1;
  }

  .overlay-sub {
    font-size: 16px;
    color: rgba(255,255,255,0.6);
    text-align: center;
    line-height: 1.6;
  }

  .overlay-score {
    font-family: 'Fredoka One', cursive;
    font-size: 20px;
    color: white;
  }

  .overlay-score span { color: #ff9f43; }

  .start-btn {
    margin-top: 8px;
    background: #ffe066;
    color: #1a0a2e;
    font-family: 'Fredoka One', cursive;
    font-size: 20px;
    border: none;
    border-radius: 50px;
    padding: 12px 40px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(255,224,102,0.4);
  }
  .start-btn:hover { transform: scale(1.05); box-shadow: 0 6px 24px rgba(255,224,102,0.5); }
  .start-btn:active { transform: scale(0.97); }

  #star-indicator {
    position: absolute;
    top: 50px;
    right: 12px;
    font-family: 'Fredoka One', cursive;
    font-size: 13px;
    color: #ffe066;
    background: rgba(255,224,102,0.15);
    border: 1px solid rgba(255,224,102,0.3);
    border-radius: 20px;
    padding: 3px 10px;
    display: none;
    align-items: center;
    gap: 4px;
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="level-display">LEVEL 1</div>
  <canvas id="canvas" width="800" height="300"></canvas>
  <div id="hud">
    <div>Score: <span id="score-display">0</span></div>
    <button id="sound-btn" title="Toggle sound">🔊</button>
    <div>Best: <span id="hi-display">0</span></div>
  </div>
  <div id="overlay">
    <div class="overlay-title" id="overlay-title">Flutter Run</div>
    <div class="overlay-sub" id="overlay-sub">Help the butterfly dodge the grumpy blobs!<br>Press <b>Space</b> or <b>↑</b> to jump</div>
    <div class="overlay-score" id="overlay-score" style="display:none">Score: <span id="final-score">0</span> &nbsp;|&nbsp; Best: <span id="final-best">0</span></div>
    <button class="start-btn" id="start-btn">Let's fly!</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// --- Assets ---
const imgs = {};
const ASSET_LIST = [
  ['butterfly', 'assets/butterfly.png'],
  ['villain',   'assets/villain.png'],
  ['star',      'assets/star.png'],
];
let assetsLoaded = 0;
ASSET_LIST.forEach(([key, src]) => {
  imgs[key] = new Image();
  imgs[key].onload = () => { assetsLoaded++; };
  imgs[key].src = src;
});

// --- Audio ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let musicGain = null, sfxGain = null;
let soundOn = true;
let musicPlaying = false;
let musicNodes = [];

function initAudio() {
  if (audioCtx) return;
  audioCtx = new AudioCtx();
  musicGain = audioCtx.createGain(); musicGain.gain.value = 0.18;
  sfxGain   = audioCtx.createGain(); sfxGain.gain.value = 0.5;
  musicGain.connect(audioCtx.destination);
  sfxGain.connect(audioCtx.destination);
}

function playTone(freq, type, duration, gainNode, when=0, vol=1) {
  if (!audioCtx || !soundOn) return;
  const osc = audioCtx.createOscillator();
  const g   = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime + when);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + when + duration);
  osc.connect(g); g.connect(gainNode || sfxGain);
  osc.start(audioCtx.currentTime + when);
  osc.stop(audioCtx.currentTime + when + duration + 0.01);
  return osc;
}

function sfxJump()   { playTone(520,'sine',0.12); playTone(680,'sine',0.1,null,0.08); }
function sfxStar()   { [600,750,900,1100].forEach((f,i) => playTone(f,'sine',0.1,null,i*0.07)); }
function sfxDie()    { [440,330,220,110].forEach((f,i) => playTone(f,'sawtooth',0.18,null,i*0.1,0.6)); }
function sfxLevel()  { [600,700,800,1000].forEach((f,i) => playTone(f,'triangle',0.12,null,i*0.05)); }

let bgPatternTime = 0;
function startMusic() {
  if (musicPlaying || !audioCtx || !soundOn) return;
  musicPlaying = true;
  const bpm = 128, beat = 60/bpm;
  // Simple looping arpeggiated melody
  const pattern = [
    [523,0],[659,0.5],[784,1],[659,1.5],
    [523,2],[698,2.5],[880,3],[698,3.5],
    [587,4],[740,4.5],[880,5],[740,5.5],
    [523,6],[659,6.5],[784,7],[659,7.5],
  ];
  const loopLen = 8; // beats
  function scheduleLoop(startTime) {
    const nodes = [];
    pattern.forEach(([freq, b]) => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const t = startTime + b * beat;
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(1, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + beat * 0.45);
      osc.connect(g); g.connect(musicGain);
      osc.start(t); osc.stop(t + beat * 0.5);
      nodes.push(osc);
    });
    // Bass
    [0,2,4,6].forEach(b => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 130;
      const t = startTime + b * beat;
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(0.8, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + beat*0.8);
      osc.connect(g); g.connect(musicGain);
      osc.start(t); osc.stop(t + beat);
      nodes.push(osc);
    });
    return startTime + loopLen * beat;
  }
  let nextLoop = audioCtx.currentTime;
  function tick() {
    if (!musicPlaying) return;
    if (nextLoop < audioCtx.currentTime + 0.5) {
      nextLoop = scheduleLoop(nextLoop);
    }
    setTimeout(tick, 200);
  }
  tick();
}

function stopMusic() { musicPlaying = false; }

// --- Game State ---
const GROUND_Y = H - 50;
const GRAVITY = 0.7;
const LEVEL_DISTANCES = [0,800,1800,3000,4500,6200,8200,10500,13000,16000];

let state = 'idle'; // idle | running | dead
let score = 0;
let hiScore = parseInt(localStorage.getItem('flutterrun_hi') || '0');
let distance = 0;
let level = 1;
let speed = 4;
let frameCount = 0;

// Player
const player = {
  x: 120, y: GROUND_Y, w: 100, h: 104,
  vy: 0, onGround: true,
  starActive: false, starTimer: 0,
  wingFlap: 0,
};

// Entities
let villains = [];
let stars = [];
let particles = [];

// Bounding boxes (65% of sprite, centred)
function bbox(e) {
  const mx = e.w * 0.175, my = e.h * 0.175;
  return { x: e.x + mx, y: e.y + my, w: e.w * 0.65, h: e.h * 0.65 };
}

function overlaps(a, b) {
  const ba = bbox(a), bb = bbox(b);
  return ba.x < bb.x+bb.w && ba.x+ba.w > bb.x && ba.y < bb.y+bb.h && ba.y+ba.h > bb.y;
}

// Cloud data
const clouds = Array.from({length: 6}, (_, i) => ({
  x: Math.random()*W, y: 30 + Math.random()*80,
  r: 28 + Math.random()*22, speed: 0.3 + Math.random()*0.4,
  alpha: 0.15 + Math.random()*0.2,
}));

// --- Spawn logic ---
function getSpawnInterval() {
  // Base interval decreases with level; more blobs at higher levels
  return Math.max(55, 130 - level * 8);
}
function getStarInterval() {
  // Star appears less often at higher levels
  return 400 + level * 60;
}
function getVillainCount() {
  // Sometimes spawn 2 at higher levels
  if (level >= 5 && Math.random() < 0.3) return 2;
  if (level >= 8 && Math.random() < 0.5) return 2;
  return 1;
}

let nextVillainIn = 80;
let nextStarIn = 300;

// --- Spawn ---
function spawnVillain() {
  const count = getVillainCount();
  const gap = 130;
  for (let i = 0; i < count; i++) {
    villains.push({ x: W + i*gap, y: GROUND_Y + (104-90), w: 85, h: 90 });
  }
}
function spawnStar() {
  stars.push({ x: W + 50, y: GROUND_Y - 80 - Math.random()*40, w: 50, h: 42, bob: Math.random()*Math.PI*2 });
}

// --- Particles ---
function burst(x, y, color, n=12) {
  for (let i=0; i<n; i++) {
    const angle = Math.random()*Math.PI*2;
    const spd = 1+Math.random()*4;
    particles.push({ x, y, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd-2,
      life: 1, decay: 0.04+Math.random()*0.04, r: 2+Math.random()*4, color });
  }
}

// --- Level up ---
function checkLevel() {
  for (let i=9; i>=0; i--) {
    if (distance >= LEVEL_DISTANCES[i]) {
      const newLevel = i+1;
      if (newLevel !== level) {
        level = newLevel;
        speed = 4 + (level-1)*0.6;
        sfxLevel();
        const ld = document.getElementById('level-display');
        ld.textContent = `LEVEL ${level}`;
        ld.classList.remove('level-up');
        void ld.offsetWidth;
        ld.classList.add('level-up');
      }
      return;
    }
  }
}

// --- Input ---
let jumpPressed = false;
function doJump() {
  if (!player.onGround) return;
  const jumpPower = player.starActive ? -18 : -13;
  player.vy = jumpPower;
  player.onGround = false;
  sfxJump();
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (state === 'idle' || state === 'dead') startGame();
    else doJump();
  }
});

document.getElementById('start-btn').addEventListener('click', () => startGame());

document.getElementById('sound-btn').addEventListener('click', () => {
  soundOn = !soundOn;
  document.getElementById('sound-btn').textContent = soundOn ? '🔊' : '🔇';
  if (soundOn && state === 'running') startMusic();
  else stopMusic();
});

// --- Game control ---
function startGame() {
  initAudio();
  state = 'running';
  score = 0; distance = 0; level = 1; speed = 4; frameCount = 0;
  player.y = GROUND_Y; player.vy = 0; player.onGround = true;
  player.starActive = false; player.starTimer = 0;
  villains = []; stars = []; particles = [];
  nextVillainIn = 80; nextStarIn = 300;
  document.getElementById('level-display').textContent = 'LEVEL 1';
  document.getElementById('overlay').classList.add('hidden');
  startMusic();
}

function gameOver() {
  state = 'dead';
  sfxDie();
  stopMusic();
  burst(player.x + 50, player.y + 52, '#ff6b6b', 20);
  if (score > hiScore) { hiScore = score; localStorage.setItem('flutterrun_hi', hiScore); }
  setTimeout(() => {
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('overlay-title').textContent = 'Oops!';
    document.getElementById('overlay-sub').textContent = 'The grumpy blob got you!';
    document.getElementById('overlay-score').style.display = 'block';
    document.getElementById('final-score').textContent = Math.floor(score);
    document.getElementById('final-best').textContent = hiScore;
    document.getElementById('start-btn').textContent = 'Try again!';
  }, 600);
}

// --- Draw helpers ---
function drawCloud(c) {
  ctx.save();
  ctx.globalAlpha = c.alpha;
  ctx.fillStyle = '#c8b8e8';
  ctx.beginPath();
  ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
  ctx.arc(c.x+c.r*0.8, c.y-c.r*0.3, c.r*0.7, 0, Math.PI*2);
  ctx.arc(c.x-c.r*0.7, c.y-c.r*0.2, c.r*0.6, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawGround() {
  // Soft ground strip
  const grd = ctx.createLinearGradient(0, GROUND_Y+104, 0, H);
  grd.addColorStop(0, '#3d1f5e');
  grd.addColorStop(1, '#1a0a2e');
  ctx.fillStyle = grd;
  ctx.fillRect(0, GROUND_Y+104, W, H-(GROUND_Y+104));
  // Ground line with glow
  ctx.shadowColor = '#a08fc0';
  ctx.shadowBlur = 6;
  ctx.strokeStyle = '#7c6fa0';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y+104); ctx.lineTo(W, GROUND_Y+104);
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawBg() {
  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y+104);
  sky.addColorStop(0,   '#1a0a2e');
  sky.addColorStop(0.5, '#2d1256');
  sky.addColorStop(1,   '#4a2070');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);
}

function drawSprite(key, x, y, w, h, alpha=1) {
  if (!imgs[key] || !imgs[key].complete) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.drawImage(imgs[key], x, y, w, h);
  ctx.restore();
}

// Star power shimmer effect
function drawPlayerStarEffect() {
  ctx.save();
  const t = Date.now()/300;
  ctx.shadowColor = '#ffe066';
  ctx.shadowBlur = 18 + Math.sin(t)*8;
  ctx.globalAlpha = 0.6;
  ctx.drawImage(imgs['butterfly'], player.x, player.y, player.w, player.h);
  ctx.restore();
}

// --- Main loop ---
function update() {
  if (state !== 'running') return;
  frameCount++;

  // Player physics
  player.vy += GRAVITY;
  player.y += player.vy;
  if (player.y >= GROUND_Y) {
    player.y = GROUND_Y;
    player.vy = 0;
    player.onGround = true;
  }

  // Star power timer
  if (player.starActive) {
    player.starTimer--;
    if (player.starTimer <= 0) { player.starActive = false; }
  }

  // Wing flap
  player.wingFlap = (player.wingFlap + 0.25) % (Math.PI*2);

  // Score & distance
  distance += speed;
  score += speed * 0.05;
  document.getElementById('score-display').textContent = Math.floor(score);
  document.getElementById('hi-display').textContent = Math.max(hiScore, Math.floor(score));

  // Level
  checkLevel();

  // Spawn
  nextVillainIn--;
  if (nextVillainIn <= 0) {
    spawnVillain();
    nextVillainIn = getSpawnInterval() + Math.floor(Math.random()*40);
  }
  nextStarIn--;
  if (nextStarIn <= 0) {
    spawnStar();
    nextStarIn = getStarInterval() + Math.floor(Math.random()*100);
  }

  // Move & cull villains
  for (let i = villains.length-1; i >= 0; i--) {
    villains[i].x -= speed;
    if (villains[i].x < -100) { villains.splice(i,1); continue; }
    if (overlaps(player, villains[i])) { gameOver(); return; }
  }

  // Move & cull stars
  for (let i = stars.length-1; i >= 0; i--) {
    stars[i].x -= speed;
    stars[i].bob += 0.05;
    if (stars[i].x < -60) { stars.splice(i,1); continue; }
    if (overlaps(player, stars[i])) {
      burst(stars[i].x+25, stars[i].y+21, '#ffe066', 16);
      stars.splice(i,1);
      player.starActive = true;
      player.starTimer = 300;
      sfxStar();
    }
  }

  // Particles
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i,1);
  }

  // Clouds drift
  clouds.forEach(c => {
    c.x -= c.speed;
    if (c.x < -80) { c.x = W+40; c.y = 30+Math.random()*80; }
  });
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBg();
  clouds.forEach(drawCloud);
  drawGround();

  // Stars
  stars.forEach(s => {
    const bobY = Math.sin(s.bob)*5;
    // Glow
    ctx.save();
    ctx.shadowColor = '#ffe066';
    ctx.shadowBlur = 14;
    drawSprite('star', s.x, s.y+bobY, s.w, s.h);
    ctx.restore();
  });

  // Villains
  villains.forEach(v => drawSprite('villain', v.x, v.y, v.w, v.h));

  // Player
  if (player.starActive) drawPlayerStarEffect();
  // Slight wing bob when on ground
  const bobOffset = player.onGround ? Math.sin(player.wingFlap)*2 : 0;
  drawSprite('butterfly', player.x, player.y + bobOffset, player.w, player.h);

  // Star timer bar
  if (player.starActive) {
    const pct = player.starTimer / 300;
    ctx.fillStyle = 'rgba(255,224,102,0.2)';
    ctx.fillRect(player.x, player.y - 10, player.w, 5);
    ctx.fillStyle = '#ffe066';
    ctx.fillRect(player.x, player.y - 10, player.w * pct, 5);
  }

  // Particles
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  // Debug bboxes (comment out for production)
  // ctx.strokeStyle='lime'; ctx.lineWidth=1;
  // [player,...villains,...stars].forEach(e=>{const b=bbox(e);ctx.strokeRect(b.x,b.y,b.w,b.h);});
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Update hi score display on load
document.getElementById('hi-display').textContent = hiScore;
loop();
</script>
</body>
</html>
