<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A fuga da Leonor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: #1a0a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
  }

  #game-wrapper {
    position: relative;
    width: 800px;
    max-width: 100vw;
  }

  #level-display {
    text-align: center;
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: #ffe066;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-shadow: 0 2px 8px rgba(255,224,102,0.4);
    height: 28px;
    transition: transform 0.2s;
  }

  #level-display.level-up {
    animation: levelPop 0.5s ease;
  }

  @keyframes levelPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.4); color: #ff9f43; }
    100% { transform: scale(1); }
  }

  #canvas {
    display: block;
    border-radius: 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }

  #hud {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 8px 4px;
    font-family: 'Fredoka One', cursive;
    font-size: 16px;
    color: rgba(255,255,255,0.7);
  }

  #hud .score-left  { text-align: left; }
  #hud .score-right { text-align: right; }
  #hud span { color: #ffe066; font-size: 18px; }

  #sound-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    color: white;
    font-size: 18px;
    width: 36px;
    height: 36px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  #sound-btn:hover { background: rgba(255,255,255,0.2); }

  #overlay {
    position: absolute;
    top: 36px;
    left: 0; right: 0; bottom: 50px;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(15, 5, 30, 0.85);
    backdrop-filter: blur(4px);
    gap: 16px;
    transition: opacity 0.3s;
    padding: 20px;
  }

  #overlay.hidden { display: none; }

  .overlay-title {
    font-family: 'Fredoka One', cursive;
    font-size: 48px;
    color: #ffe066;
    text-shadow: 0 4px 16px rgba(255,224,102,0.5);
    line-height: 1;
    text-align: center;
  }

  .overlay-sub {
    font-size: 16px;
    color: rgba(255,255,255,0.7);
    text-align: center;
    line-height: 1.6;
  }

  .overlay-score {
    font-family: 'Fredoka One', cursive;
    font-size: 20px;
    color: white;
  }

  .overlay-score span { color: #ff9f43; }

  .start-btn {
    margin-top: 8px;
    background: #ffe066;
    color: #1a0a2e;
    font-family: 'Fredoka One', cursive;
    font-size: 20px;
    border: none;
    border-radius: 50px;
    padding: 12px 40px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(255,224,102,0.4);
  }
  .start-btn:hover { transform: scale(1.05); box-shadow: 0 6px 24px rgba(255,224,102,0.5); }
  .start-btn:active { transform: scale(0.97); }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="level-display">NÍVEL 1</div>
  <canvas id="canvas" width="800" height="380"></canvas>
  <div id="hud">
    <div class="score-left">Pontos: <span id="score-display">0</span></div>
    <button id="sound-btn" title="Ligar/desligar som">🔊</button>
    <div class="score-right">Recorde: <span id="hi-display">0</span></div>
  </div>
  <div id="overlay">
    <div class="overlay-title" id="overlay-title">A fuga da Leonor</div>
    <div class="overlay-sub" id="overlay-sub">Ajuda a Leonor a fugir das gosmas rabugentas!<br>Carrega em <b>Espaço</b> ou <b>↑</b> para saltar</div>
    <div class="overlay-score" id="overlay-score" style="display:none">Pontos: <span id="final-score">0</span> &nbsp;|&nbsp; Recorde: <span id="final-best">0</span></div>
    <button class="start-btn" id="start-btn">Vamos lá!</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// --- Assets ---
const imgs = {};
const masks = {}; // alpha masks for pixel-perfect collision: { data: Uint8Array, w, h }

// [key, src, needsCollisionMask]
// Decorative-only assets (clouds, etc.) skip mask generation.
// If an asset file is missing the game still runs — that asset just won't render.
const ASSET_LIST = [
  ['butterfly', 'assets/butterfly.png', true],
  ['villain',   'assets/villain.png',   true],
  ['star',      'assets/star.png',      true],
  ['evilstar',  'assets/evilstar.png',  true],
  ['cloud',     'assets/clouds.png',    false],
];
let assetsLoaded = 0;
ASSET_LIST.forEach(([key, src, needsMask]) => {
  imgs[key] = new Image();
  imgs[key].onload = () => {
    if (needsMask) {
      // Build alpha mask once the image has loaded
      const w = imgs[key].naturalWidth, h = imgs[key].naturalHeight;
      const off = document.createElement('canvas');
      off.width = w; off.height = h;
      const octx = off.getContext('2d');
      octx.drawImage(imgs[key], 0, 0);
      const pixels = octx.getImageData(0, 0, w, h).data;
      const mask = new Uint8Array(w * h);
      for (let i = 0; i < w * h; i++) {
        mask[i] = pixels[i * 4 + 3] > 30 ? 1 : 0;
      }
      masks[key] = { data: mask, w, h };
    }
    assetsLoaded++;
  };
  // Don't break the game if a non-essential asset (e.g. clouds.png) is missing
  imgs[key].onerror = () => { assetsLoaded++; };
  imgs[key].src = src;
});

// --- Fixed background palette (warm sunset, applied to every level) ---
const PALETTE = { top:'#ff8a5b', mid:'#ffb380', bot:'#ffd4a3', gT:'#c4623a', gB:'#7a3820', cloud:'#fff4e0', line:'#a85f3d' };

// --- Audio ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let musicGain = null, sfxGain = null, masterGain = null;
let soundOn = true;
let musicLoopId = null;
let scheduledOscs = []; // track all oscillators we've scheduled so we can stop them on restart

// HTMLAudio for the music file. If assets/music.mp3 loads successfully,
// it's used as background music. Otherwise the synth music plays as fallback.
const musicAudio = new Audio('assets/music.mp3');
musicAudio.loop = true;
musicAudio.volume = 0.4;
let musicFileAvailable = false;
musicAudio.addEventListener('canplaythrough', () => { musicFileAvailable = true; }, { once: true });
musicAudio.addEventListener('error', () => { musicFileAvailable = false; });

function initAudio() {
  if (audioCtx) return;
  audioCtx = new AudioCtx();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 1;
  masterGain.connect(audioCtx.destination);
  musicGain = audioCtx.createGain(); musicGain.gain.value = 0.18;
  sfxGain   = audioCtx.createGain(); sfxGain.gain.value = 0.5;
  musicGain.connect(masterGain);
  sfxGain.connect(masterGain);
}

function playTone(freq, type, duration, gainNode, when=0, vol=1) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g   = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime + when);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + when + duration);
  osc.connect(g); g.connect(gainNode || sfxGain);
  osc.start(audioCtx.currentTime + when);
  osc.stop(audioCtx.currentTime + when + duration + 0.01);
  return osc;
}

function sfxJump()   { playTone(520,'sine',0.12); playTone(680,'sine',0.1,null,0.08); }
function sfxStar()   { [800,1100,1400].forEach((f,i) => playTone(f,'sine',0.06,null,i*0.025,0.6)); }
function sfxEvilStar() { [400,300,200].forEach((f,i) => playTone(f,'square',0.1,null,i*0.05,0.5)); }
function sfxDie()    { [440,330,220,110].forEach((f,i) => playTone(f,'sawtooth',0.18,null,i*0.1,0.6)); }
function sfxLevel()  { [600,700,800,1000].forEach((f,i) => playTone(f,'triangle',0.12,null,i*0.05)); }

function startMusic() {
  // Prefer the music file when available
  if (musicFileAvailable) {
    musicAudio.currentTime = 0;
    musicAudio.muted = !soundOn;
    musicAudio.play().catch(() => { /* user gesture issues are silently ignored */ });
    return;
  }
  // Fallback: synth music (only if audio context exists)
  if (musicLoopId !== null || !audioCtx) return;
  const bpm = 128, beat = 60/bpm;
  const pattern = [
    [523,0],[659,0.5],[784,1],[659,1.5],
    [523,2],[698,2.5],[880,3],[698,3.5],
    [587,4],[740,4.5],[880,5],[740,5.5],
    [523,6],[659,6.5],[784,7],[659,7.5],
  ];
  const loopLen = 8;
  function scheduleLoop(startTime) {
    pattern.forEach(([freq, b]) => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const t = startTime + b * beat;
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(1, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + beat * 0.45);
      osc.connect(g); g.connect(musicGain);
      osc.start(t); osc.stop(t + beat * 0.5);
      scheduledOscs.push(osc);
    });
    [0,2,4,6].forEach(b => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 130;
      const t = startTime + b * beat;
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(0.8, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + beat*0.8);
      osc.connect(g); g.connect(musicGain);
      osc.start(t); osc.stop(t + beat);
      scheduledOscs.push(osc);
    });
    return startTime + loopLen * beat;
  }
  let nextLoop = audioCtx.currentTime;
  function tick() {
    if (musicLoopId === null) return;
    if (nextLoop < audioCtx.currentTime + 0.5) {
      nextLoop = scheduleLoop(nextLoop);
    }
    musicLoopId = setTimeout(tick, 200);
  }
  musicLoopId = setTimeout(tick, 0);
}

function stopMusic() {
  // Stop file-based music
  try { musicAudio.pause(); musicAudio.currentTime = 0; } catch(e) {}
  // Stop synth music
  if (musicLoopId !== null) { clearTimeout(musicLoopId); musicLoopId = null; }
  scheduledOscs.forEach(osc => {
    try { osc.stop(0); } catch(e) {}
    try { osc.disconnect(); } catch(e) {}
  });
  scheduledOscs = [];
}

// --- Game State ---
const GROUND_Y = H - 130;
// Distance thresholds for each level. The gap between levels grows
// gradually so later levels last a bit longer than early ones.
const LEVEL_DISTANCES = [
  0, 800, 1800, 3000, 4500, 6200, 8200, 10500, 13000, 16000,
  19200, 22600, 26200, 30000, 34000, 38200, 42600, 47200, 52000, 57000,
];
const MAX_LEVEL = LEVEL_DISTANCES.length; // 20

// =============================================================
// 🦋 JUMP CONFIG — tweak these to adjust how the butterfly jumps
// =============================================================
// All values are in physics units per frame (game runs at 60fps).
// GRAVITY: pull-down force.
//   Lower  = floatier, slower fall, more hang time
//   Higher = snappier, heavier feel
// JUMP_VELOCITY: starting upward speed when jumping (negative because Y grows downward).
//   More negative = higher jumps. Less negative = lower jumps.
// STAR_GRAVITY_REDUCTION_PER_STAR: each star REDUCES gravity by this fraction.
//   So peak jump height stays roughly the same, but the butterfly hangs in the
//   air longer — making it easier to clear obstacles without flying off-screen.
//   Example: 0.06 = each star reduces gravity by 6%. With 10 stars, gravity is 40% of base.
// STAR_JUMP_BOOST_PER_STAR: small extra jump-velocity boost per star (kept gentle).
// MAX_STARS: cap on collected stars.
const JUMP_CONFIG = {
  GRAVITY:                          0.38,   // try 0.30 (very floaty) → 0.70 (snappy)
  JUMP_VELOCITY:                   -12,     // base jump strength (negative). Try -10 → -16
  STAR_JUMP_BOOST_PER_STAR:        -0.5,    // each star adds this much extra jump (gentle)
  STAR_GRAVITY_REDUCTION_PER_STAR:  0.06,   // each star reduces gravity by this fraction
  MIN_GRAVITY_FACTOR:               0.35,   // floor: gravity never drops below 35% of base
  MAX_STARS:                       10,      // cap on collected stars
};
// =============================================================

let state = 'idle';
let score = 0;
let hiScore = parseInt(localStorage.getItem('leonor_hi') || '0');
let distance = 0;
let level = 1;
let speed = 3;
let frameCount = 0;
let deathTime = 0; // timestamp when player died, used to lock out instant restart
const DEATH_LOCKOUT_MS = 600; // matches the overlay reveal delay below

const player = {
  x: 120, y: GROUND_Y, w: 100, h: 104,
  vy: 0, onGround: true,
  starsCollected: 0, // how many stars stacked
  wingFlap: 0,
};

let villains = [];
let stars = [];
let evilStars = []; // bad stars that remove a collected star on contact
let particles = [];

// Pixel-perfect collision using alpha masks.
// Fast AABB pre-check, then sample overlapping region against both masks.
function overlaps(a, aKey, b, bKey) {
  // AABB first
  if (a.x >= b.x + b.w || a.x + a.w <= b.x) return false;
  if (a.y >= b.y + b.h || a.y + a.h <= b.y) return false;

  const mA = masks[aKey], mB = masks[bKey];
  if (!mA || !mB) return false; // masks not yet built — fall through to no-collision

  // Compute the overlapping rectangle in world space
  const x1 = Math.max(a.x, b.x);
  const y1 = Math.max(a.y, b.y);
  const x2 = Math.min(a.x + a.w, b.x + b.w);
  const y2 = Math.min(a.y + a.h, b.y + b.h);

  // Step in pixels — sample every 2px for performance, still very accurate
  const step = 2;
  // Map from world coord -> source-image pixel coord (sprites may be scaled)
  const sxA = mA.w / a.w, syA = mA.h / a.h;
  const sxB = mB.w / b.w, syB = mB.h / b.h;

  for (let y = y1; y < y2; y += step) {
    for (let x = x1; x < x2; x += step) {
      const ax = ((x - a.x) * sxA) | 0;
      const ay = ((y - a.y) * syA) | 0;
      if (mA.data[ay * mA.w + ax] === 0) continue;
      const bx = ((x - b.x) * sxB) | 0;
      const by = ((y - b.y) * syB) | 0;
      if (mB.data[by * mB.w + bx] === 1) return true;
    }
  }
  return false;
}

// Cloud objects — image-based, with random size variation for natural feel.
// Image source: assets/clouds.png (120×94 base size; PNG with transparency recommended).
// Each cloud gets a random scale between CLOUD_MIN_SCALE and CLOUD_MAX_SCALE
// so they feel varied. Speed is also randomised so they drift independently.
const CLOUD_BASE_W = 120;
const CLOUD_BASE_H = 94;
const CLOUD_MIN_SCALE = 0.55;
const CLOUD_MAX_SCALE = 1.15;
const CLOUD_COUNT = 5;

function makeCloud(spawnAtRight = false) {
  const scale = CLOUD_MIN_SCALE + Math.random() * (CLOUD_MAX_SCALE - CLOUD_MIN_SCALE);
  const w = CLOUD_BASE_W * scale;
  const h = CLOUD_BASE_H * scale;
  return {
    // If spawnAtRight, place just off the right edge; otherwise scatter across visible area
    x: spawnAtRight ? W + Math.random()*100 : Math.random() * W,
    y: 10 + Math.random() * 100, // vary vertical position
    w, h,
    speed: 15 + Math.random() * 25,    // pixels per SECOND (delta-time scaled), drifts naturally
    alpha: 0.55 + Math.random() * 0.35, // varying opacity for depth
  };
}
const clouds = Array.from({length: CLOUD_COUNT}, () => makeCloud(false));

function getSpawnInterval() {
  // Gap between villain waves shrinks with level. Floor of 50 frames
  // (~0.83s at 60fps) keeps level 20 tough but still reactable with stars.
  return Math.max(50, 170 - level * 6);
}
function getStarInterval() {
  // Stars get rarer as levels rise — capped so they still appear at level 20
  return Math.min(900, 350 + level * 35);
}
function getEvilStarInterval() {
  // Evil stars start appearing from level 2 and become more frequent at higher levels.
  // Always less common than good stars (longer interval).
  if (level < 2) return Infinity; // no evil stars at level 1
  return Math.max(450, 1100 - level * 30);
}
function getVillainCount() {
  // More likely to spawn doubles as levels progress.
  // At level 15+, occasionally three villains appear in a tight cluster.
  if (level >= 15 && Math.random() < 0.2) return 3;
  if (level >= 12 && Math.random() < 0.45) return 2;
  if (level >= 9  && Math.random() < 0.4) return 2;
  if (level >= 6  && Math.random() < 0.3) return 2;
  return 1;
}

let nextVillainIn = 120;
let nextStarIn = 250;
let nextEvilStarIn = 600; // evil stars are rarer than good ones

// Villain size variance — base is 80×85, scales between min and max for visual variety.
// Bottoms always align with the ground line (feet on the floor).
const VILLAIN_BASE_W = 80;
const VILLAIN_BASE_H = 85;
const VILLAIN_MIN_SCALE = 0.85;
const VILLAIN_MAX_SCALE = 1.25;

function spawnVillain() {
  const count = getVillainCount();
  const gap = 150;
  for (let i = 0; i < count; i++) {
    // Each villain in the wave gets its own random size for natural feel
    const scale = VILLAIN_MIN_SCALE + Math.random() * (VILLAIN_MAX_SCALE - VILLAIN_MIN_SCALE);
    const w = VILLAIN_BASE_W * scale;
    const h = VILLAIN_BASE_H * scale;
    // Keep feet on the ground: top = GROUND_Y + (butterfly_h - this_villain_h)
    villains.push({ x: W + i*gap, y: GROUND_Y + (104 - h), w, h });
  }
}
function spawnStar() {
  stars.push({ x: W + 50, y: GROUND_Y - 90 - Math.random()*30, w: 50, h: 42, bob: Math.random()*Math.PI*2 });
}
function spawnEvilStar() {
  // Evil star sits at a similar height to a regular star
  evilStars.push({ x: W + 50, y: GROUND_Y - 90 - Math.random()*30, w: 50, h: 42, bob: Math.random()*Math.PI*2 });
}

function burst(x, y, color, n=12) {
  for (let i=0; i<n; i++) {
    const angle = Math.random()*Math.PI*2;
    const spd = 1+Math.random()*4;
    particles.push({ x, y, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd-2,
      life: 1, decay: 0.04+Math.random()*0.04, r: 2+Math.random()*4, color });
  }
}

function checkLevel() {
  for (let i = MAX_LEVEL - 1; i >= 0; i--) {
    if (distance >= LEVEL_DISTANCES[i]) {
      const newLevel = i+1;
      if (newLevel !== level) {
        level = newLevel;
        // Speed scaling tapers off after level 10 so level 20 isn't unplayable.
        // L1=3, L10≈7.5, L15≈9, L20≈10.5 px/frame at 60fps.
        speed = 3 + Math.min(level-1, 9) * 0.5 + Math.max(0, level-10) * 0.3;
        // Level-up no longer plays a sound — visual cue (level text pop) is enough
        const ld = document.getElementById('level-display');
        ld.textContent = `NÍVEL ${level}`;
        ld.classList.remove('level-up');
        void ld.offsetWidth;
        ld.classList.add('level-up');
      }
      return;
    }
  }
}

function doJump() {
  if (!player.onGround) return;
  // Base jump + small extra boost per star (most of the star benefit comes from
  // reduced gravity in the update loop — see currentGravity()).
  const stars = Math.min(player.starsCollected, JUMP_CONFIG.MAX_STARS);
  const jumpPower = JUMP_CONFIG.JUMP_VELOCITY + stars * JUMP_CONFIG.STAR_JUMP_BOOST_PER_STAR;
  player.vy = jumpPower;
  player.onGround = false;
  sfxJump();
}

// Compute current gravity based on collected stars.
// Each star reduces gravity by STAR_GRAVITY_REDUCTION_PER_STAR (fractional).
// Floored at MIN_GRAVITY_FACTOR so the butterfly never floats forever.
function currentGravity() {
  const stars = Math.min(player.starsCollected, JUMP_CONFIG.MAX_STARS);
  const factor = Math.max(
    JUMP_CONFIG.MIN_GRAVITY_FACTOR,
    1 - stars * JUMP_CONFIG.STAR_GRAVITY_REDUCTION_PER_STAR
  );
  return JUMP_CONFIG.GRAVITY * factor;
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (state === 'idle') {
      startGame();
    } else if (state === 'dead') {
      // Ignore presses during the brief death animation window.
      // The overlay only appears after this delay, so the user knows when they can restart.
      if (Date.now() - deathTime >= DEATH_LOCKOUT_MS) startGame();
    } else {
      doJump();
    }
  }
});

document.getElementById('start-btn').addEventListener('click', () => startGame());

document.getElementById('sound-btn').addEventListener('click', () => {
  initAudio();
  soundOn = !soundOn;
  document.getElementById('sound-btn').textContent = soundOn ? '🔊' : '🔇';
  if (masterGain && audioCtx) {
    masterGain.gain.setTargetAtTime(soundOn ? 1 : 0, audioCtx.currentTime, 0.02);
  }
  // Also mute the file-based music (which doesn't route through Web Audio)
  musicAudio.muted = !soundOn;
});

function startGame() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  stopMusic(); // ensure no leftover music from previous round
  state = 'running';
  score = 0; distance = 0; level = 1; speed = 3; frameCount = 0;
  player.y = GROUND_Y; player.vy = 0; player.onGround = true;
  player.starsCollected = 0;
  villains = []; stars = []; evilStars = []; particles = [];
  nextVillainIn = 120; nextStarIn = 250; nextEvilStarIn = 600;
  document.getElementById('level-display').textContent = 'NÍVEL 1';
  document.getElementById('overlay').classList.add('hidden');
  startMusic();
}

function gameOver() {
  state = 'dead';
  deathTime = Date.now();
  sfxDie();
  stopMusic();
  burst(player.x + 50, player.y + 52, '#ff6b6b', 20);
  if (Math.floor(score) > hiScore) {
    hiScore = Math.floor(score);
    localStorage.setItem('leonor_hi', hiScore);
  }
  setTimeout(() => {
    // Guard: if the user already restarted (somehow), don't pop the overlay back open
    if (state !== 'dead') return;
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('overlay-title').textContent = 'Oh não!';
    document.getElementById('overlay-sub').textContent = 'A gosma apanhou-te!';
    document.getElementById('overlay-score').style.display = 'block';
    document.getElementById('final-score').textContent = Math.floor(score);
    document.getElementById('final-best').textContent = hiScore;
    document.getElementById('start-btn').textContent = 'Tentar outra vez!';
  }, DEATH_LOCKOUT_MS);
}

function drawCloud(c) {
  // Falls back to nothing if clouds.png hasn't been added yet.
  if (!imgs.cloud || !imgs.cloud.complete || !imgs.cloud.naturalWidth) return;
  ctx.save();
  ctx.globalAlpha = c.alpha;
  ctx.drawImage(imgs.cloud, c.x, c.y, c.w, c.h);
  ctx.restore();
}

function drawGround(palette) {
  const grd = ctx.createLinearGradient(0, GROUND_Y+104, 0, H);
  grd.addColorStop(0, palette.gT);
  grd.addColorStop(1, palette.gB);
  ctx.fillStyle = grd;
  ctx.fillRect(0, GROUND_Y+104, W, H-(GROUND_Y+104));
  ctx.shadowColor = palette.line;
  ctx.shadowBlur = 6;
  ctx.strokeStyle = palette.line;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y+104); ctx.lineTo(W, GROUND_Y+104);
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawBg(palette) {
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y+104);
  sky.addColorStop(0,   palette.top);
  sky.addColorStop(0.5, palette.mid);
  sky.addColorStop(1,   palette.bot);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);
}

function drawSprite(key, x, y, w, h, alpha=1) {
  if (!imgs[key] || !imgs[key].complete) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.drawImage(imgs[key], x, y, w, h);
  ctx.restore();
}

function drawPlayerStarEffect() {
  ctx.save();
  const t = Date.now()/300;
  // Glow grows with stars collected
  const intensity = Math.min(player.starsCollected, JUMP_CONFIG.MAX_STARS);
  ctx.shadowColor = '#ffe066';
  ctx.shadowBlur = 10 + intensity * 6 + Math.sin(t)*5;
  ctx.globalAlpha = 0.5 + intensity * 0.08;
  ctx.drawImage(imgs['butterfly'], player.x, player.y, player.w, player.h);
  ctx.restore();
}

// Draw small star indicators in the top-left of canvas to show stack count
function drawStarIndicators() {
  const count = Math.min(player.starsCollected, JUMP_CONFIG.MAX_STARS);
  if (count === 0) return;
  const sw = 24, sh = 20, gap = 4;
  for (let i = 0; i < count; i++) {
    const x = 12 + i * (sw + gap);
    const y = 12;
    ctx.save();
    ctx.shadowColor = '#ffe066';
    ctx.shadowBlur = 8;
    drawSprite('star', x, y, sw, sh);
    ctx.restore();
  }
}

function update(dt) {
  // dt is seconds elapsed since the last frame.
  // Most movement code was written for 60fps. To stay consistent across refresh
  // rates (60Hz vs 120Hz vs 144Hz), we multiply per-frame values by `df`
  // ("delta frames") = how many 60fps frames worth of time just passed.
  if (state !== 'running') return;
  const df = dt * 60;
  frameCount++;

  player.vy += currentGravity() * df;
  player.y += player.vy * df;
  if (player.y >= GROUND_Y) {
    player.y = GROUND_Y;
    player.vy = 0;
    player.onGround = true;
  }

  // Star power persists once collected — no timer

  player.wingFlap = (player.wingFlap + 0.25 * df) % (Math.PI*2);

  distance += speed * df;
  score += speed * 0.05 * df;
  document.getElementById('score-display').textContent = Math.floor(score);
  document.getElementById('hi-display').textContent = Math.max(hiScore, Math.floor(score));

  checkLevel();

  nextVillainIn -= df;
  if (nextVillainIn <= 0) {
    spawnVillain();
    nextVillainIn = getSpawnInterval() + Math.floor(Math.random()*40);
  }
  nextStarIn -= df;
  if (nextStarIn <= 0) {
    spawnStar();
    nextStarIn = getStarInterval() + Math.floor(Math.random()*100);
  }
  nextEvilStarIn -= df;
  if (nextEvilStarIn <= 0) {
    spawnEvilStar();
    nextEvilStarIn = getEvilStarInterval() + Math.floor(Math.random()*200);
  }

  for (let i = villains.length-1; i >= 0; i--) {
    villains[i].x -= speed * df;
    if (villains[i].x < -100) { villains.splice(i,1); continue; }
    if (overlaps(player, 'butterfly', villains[i], 'villain')) { gameOver(); return; }
  }

  for (let i = stars.length-1; i >= 0; i--) {
    stars[i].x -= speed * df;
    stars[i].bob += 0.05 * df;
    if (stars[i].x < -60) { stars.splice(i,1); continue; }
    if (overlaps(player, 'butterfly', stars[i], 'star')) {
      burst(stars[i].x+25, stars[i].y+21, '#ffe066', 8);
      stars.splice(i,1);
      if (player.starsCollected < JUMP_CONFIG.MAX_STARS) {
        player.starsCollected++;
      }
      sfxStar();
    }
  }

  // Evil stars: move and check for collision. On contact, remove one collected star.
  for (let i = evilStars.length-1; i >= 0; i--) {
    evilStars[i].x -= speed * df;
    evilStars[i].bob += 0.05 * df;
    if (evilStars[i].x < -60) { evilStars.splice(i,1); continue; }
    if (overlaps(player, 'butterfly', evilStars[i], 'evilstar')) {
      // Red/purple burst to signal a "loss"
      burst(evilStars[i].x+25, evilStars[i].y+21, '#ff4d6d', 10);
      evilStars.splice(i,1);
      if (player.starsCollected > 0) player.starsCollected--;
      sfxEvilStar();
    }
  }

  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * df; p.y += p.vy * df; p.vy += 0.15 * df;
    p.life -= p.decay * df;
    if (p.life <= 0) particles.splice(i,1);
  }

  // Clouds drift right-to-left independently of game speed.
  // Their .speed is already in pixels-per-second, so multiply by raw dt.
  clouds.forEach(c => {
    c.x -= c.speed * dt;
    // Cull when fully off the left edge, then respawn just past the right edge
    if (c.x + c.w < 0) {
      const fresh = makeCloud(true); // spawn at right
      Object.assign(c, fresh);
    }
  });
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBg(PALETTE);
  clouds.forEach(c => drawCloud(c));
  drawGround(PALETTE);

  stars.forEach(s => {
    const bobY = Math.sin(s.bob)*5;
    ctx.save();
    ctx.shadowColor = '#ffe066';
    ctx.shadowBlur = 14;
    drawSprite('star', s.x, s.y+bobY, s.w, s.h);
    ctx.restore();
  });

  evilStars.forEach(s => {
    const bobY = Math.sin(s.bob)*5;
    ctx.save();
    ctx.shadowColor = '#ff4d6d'; // red glow to warn the player
    ctx.shadowBlur = 16;
    drawSprite('evilstar', s.x, s.y+bobY, s.w, s.h);
    ctx.restore();
  });

  villains.forEach(v => drawSprite('villain', v.x, v.y, v.w, v.h));

  if (player.starsCollected > 0) drawPlayerStarEffect();
  const bobOffset = player.onGround ? Math.sin(player.wingFlap)*2 : 0;
  drawSprite('butterfly', player.x, player.y + bobOffset, player.w, player.h);

  // Render particles in a single state — set alpha once per particle but
  // skip save/restore (they're expensive in canvas). globalAlpha is cheap to set.
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawStarIndicators();
}

// Main loop with delta-time so the game runs at the same speed regardless
// of the display's refresh rate (60Hz vs 120Hz vs 144Hz). Without this,
// the game appears faster on high-refresh-rate monitors.
let lastFrameTime = 0;
function loop(now) {
  if (!lastFrameTime) lastFrameTime = now;
  // dt is seconds since previous frame. Cap at 0.05s to avoid huge jumps if the
  // tab was backgrounded (otherwise the player would teleport through obstacles).
  const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
  lastFrameTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

document.getElementById('hi-display').textContent = hiScore;
requestAnimationFrame(loop);
</script>
</body>
</html>
