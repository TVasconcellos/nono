<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A fuga da Leonor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: #1a0a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
  }

  #game-wrapper {
    position: relative;
    width: 800px;
    max-width: 100vw;
  }

  #level-display {
    text-align: center;
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: #ffe066;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-shadow: 0 2px 8px rgba(255,224,102,0.4);
    height: 28px;
    transition: transform 0.2s;
  }

  #level-display.level-up {
    animation: levelPop 0.5s ease;
  }

  @keyframes levelPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.4); color: #ff9f43; }
    100% { transform: scale(1); }
  }

  #canvas {
    display: block;
    border-radius: 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }

  #hud {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 8px 4px;
    font-family: 'Fredoka One', cursive;
    font-size: 16px;
    color: rgba(255,255,255,0.7);
  }

  #hud .score-left  { text-align: left; }
  #hud .score-right { text-align: right; }
  #hud span { color: #ffe066; font-size: 18px; }

  #sound-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    color: white;
    font-size: 18px;
    width: 36px;
    height: 36px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  #sound-btn:hover { background: rgba(255,255,255,0.2); }

  #overlay {
    position: absolute;
    top: 36px;
    left: 0; right: 0; bottom: 50px;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(15, 5, 30, 0.85);
    backdrop-filter: blur(4px);
    gap: 16px;
    transition: opacity 0.3s;
    padding: 20px;
  }

  #overlay.hidden { display: none; }

  .overlay-title {
    font-family: 'Fredoka One', cursive;
    font-size: 48px;
    color: #ffe066;
    text-shadow: 0 4px 16px rgba(255,224,102,0.5);
    line-height: 1;
    text-align: center;
  }

  .overlay-sub {
    font-size: 16px;
    color: rgba(255,255,255,0.7);
    text-align: center;
    line-height: 1.6;
  }

  .overlay-score {
    font-family: 'Fredoka One', cursive;
    font-size: 20px;
    color: white;
  }

  .overlay-score span { color: #ff9f43; }

  .start-btn {
    margin-top: 8px;
    background: #ffe066;
    color: #1a0a2e;
    font-family: 'Fredoka One', cursive;
    font-size: 20px;
    border: none;
    border-radius: 50px;
    padding: 12px 40px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(255,224,102,0.4);
  }
  .start-btn:hover { transform: scale(1.05); box-shadow: 0 6px 24px rgba(255,224,102,0.5); }
  .start-btn:active { transform: scale(0.97); }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="level-display">NÍVEL 1</div>
  <canvas id="canvas" width="800" height="380"></canvas>
  <div id="hud">
    <div class="score-left">Pontos: <span id="score-display">0</span></div>
    <button id="sound-btn" title="Ligar/desligar som">🔊</button>
    <div class="score-right">Recorde: <span id="hi-display">0</span></div>
  </div>
  <div id="overlay">
    <div class="overlay-title" id="overlay-title">A fuga da Leonor</div>
    <div class="overlay-sub" id="overlay-sub">Ajuda a Leonor a fugir das gosmas rabugentas!<br>Carrega em <b>Espaço</b> ou <b>↑</b> para saltar</div>
    <div class="overlay-score" id="overlay-score" style="display:none">Pontos: <span id="final-score">0</span> &nbsp;|&nbsp; Recorde: <span id="final-best">0</span></div>
    <button class="start-btn" id="start-btn">Vamos lá!</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// --- Assets ---
const imgs = {};
const masks = {}; // alpha masks for pixel-perfect collision: { data: Uint8Array, w, h }
const ASSET_LIST = [
  ['butterfly', 'assets/butterfly.png'],
  ['villain',   'assets/villain.png'],
  ['star',      'assets/star.png'],
];
let assetsLoaded = 0;
ASSET_LIST.forEach(([key, src]) => {
  imgs[key] = new Image();
  imgs[key].onload = () => {
    // Build alpha mask once the image has loaded
    const w = imgs[key].naturalWidth, h = imgs[key].naturalHeight;
    const off = document.createElement('canvas');
    off.width = w; off.height = h;
    const octx = off.getContext('2d');
    octx.drawImage(imgs[key], 0, 0);
    const pixels = octx.getImageData(0, 0, w, h).data;
    const mask = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) {
      mask[i] = pixels[i * 4 + 3] > 30 ? 1 : 0;
    }
    masks[key] = { data: mask, w, h };
    assetsLoaded++;
  };
  imgs[key].src = src;
});

// --- Level palettes (one per level) ---
const PALETTES = [
  { top:'#1a0a2e', mid:'#2d1256', bot:'#4a2070', gT:'#3d1f5e', gB:'#1a0a2e', cloud:'#c8b8e8', line:'#7c6fa0' },
  { top:'#0f2c4a', mid:'#1d4a7a', bot:'#3a7ab0', gT:'#1d4a7a', gB:'#0f2c4a', cloud:'#aed4f0', line:'#5a8fc0' },
  { top:'#ff8a5b', mid:'#ffb380', bot:'#ffd4a3', gT:'#c4623a', gB:'#7a3820', cloud:'#fff4e0', line:'#a85f3d' },
  { top:'#0a2818', mid:'#1f5a3a', bot:'#3d8a5e', gT:'#1f5a3a', gB:'#0a2818', cloud:'#c8e8d4', line:'#5a9a78' },
  { top:'#3a0a4a', mid:'#7a1a8a', bot:'#c44ac4', gT:'#5a1a6a', gB:'#2a0530', cloud:'#f0c8e8', line:'#9a5aa8' },
  { top:'#0a2a3a', mid:'#1a5a7a', bot:'#3aaab8', gT:'#1a4a5a', gB:'#0a2a3a', cloud:'#c0e8ec', line:'#5aa8b8' },
  { top:'#4a2010', mid:'#8a4520', bot:'#d48050', gT:'#5a2818', gB:'#2a1008', cloud:'#f0d4b8', line:'#a86848' },
  { top:'#1a0a3a', mid:'#3a1a6a', bot:'#6a3aaa', gT:'#2a1a5a', gB:'#0a0520', cloud:'#c8b8f0', line:'#7a5ac0' },
  { top:'#2a0a0a', mid:'#7a1a2a', bot:'#c4404a', gT:'#4a1010', gB:'#1a0505', cloud:'#f0c0c8', line:'#a04050' },
  { top:'#000000', mid:'#1a0a3a', bot:'#3a1a5a', gT:'#1a0a2a', gB:'#000000', cloud:'#f0e8ff', line:'#a090d0' },
];

// --- Audio ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let musicGain = null, sfxGain = null, masterGain = null;
let soundOn = true;
let musicLoopId = null;
let scheduledOscs = []; // track all oscillators we've scheduled so we can stop them on restart

function initAudio() {
  if (audioCtx) return;
  audioCtx = new AudioCtx();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 1;
  masterGain.connect(audioCtx.destination);
  musicGain = audioCtx.createGain(); musicGain.gain.value = 0.18;
  sfxGain   = audioCtx.createGain(); sfxGain.gain.value = 0.5;
  musicGain.connect(masterGain);
  sfxGain.connect(masterGain);
}

function playTone(freq, type, duration, gainNode, when=0, vol=1) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g   = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime + when);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + when + duration);
  osc.connect(g); g.connect(gainNode || sfxGain);
  osc.start(audioCtx.currentTime + when);
  osc.stop(audioCtx.currentTime + when + duration + 0.01);
  return osc;
}

function sfxJump()   { playTone(520,'sine',0.12); playTone(680,'sine',0.1,null,0.08); }
function sfxStar()   { [600,750,900,1100].forEach((f,i) => playTone(f,'sine',0.1,null,i*0.07)); }
function sfxDie()    { [440,330,220,110].forEach((f,i) => playTone(f,'sawtooth',0.18,null,i*0.1,0.6)); }
function sfxLevel()  { [600,700,800,1000].forEach((f,i) => playTone(f,'triangle',0.12,null,i*0.05)); }

function startMusic() {
  if (musicLoopId !== null || !audioCtx) return;
  const bpm = 128, beat = 60/bpm;
  const pattern = [
    [523,0],[659,0.5],[784,1],[659,1.5],
    [523,2],[698,2.5],[880,3],[698,3.5],
    [587,4],[740,4.5],[880,5],[740,5.5],
    [523,6],[659,6.5],[784,7],[659,7.5],
  ];
  const loopLen = 8;
  function scheduleLoop(startTime) {
    pattern.forEach(([freq, b]) => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const t = startTime + b * beat;
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(1, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + beat * 0.45);
      osc.connect(g); g.connect(musicGain);
      osc.start(t); osc.stop(t + beat * 0.5);
      scheduledOscs.push(osc);
    });
    [0,2,4,6].forEach(b => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 130;
      const t = startTime + b * beat;
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(0.8, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + beat*0.8);
      osc.connect(g); g.connect(musicGain);
      osc.start(t); osc.stop(t + beat);
      scheduledOscs.push(osc);
    });
    return startTime + loopLen * beat;
  }
  let nextLoop = audioCtx.currentTime;
  function tick() {
    if (musicLoopId === null) return;
    if (nextLoop < audioCtx.currentTime + 0.5) {
      nextLoop = scheduleLoop(nextLoop);
    }
    musicLoopId = setTimeout(tick, 200);
  }
  musicLoopId = setTimeout(tick, 0);
}

function stopMusic() {
  if (musicLoopId !== null) { clearTimeout(musicLoopId); musicLoopId = null; }
  // Stop all scheduled oscillators immediately so they don't bleed into next round
  scheduledOscs.forEach(osc => {
    try { osc.stop(0); } catch(e) {}
    try { osc.disconnect(); } catch(e) {}
  });
  scheduledOscs = [];
}

// --- Game State ---
const GROUND_Y = H - 130;
const LEVEL_DISTANCES = [0,800,1800,3000,4500,6200,8200,10500,13000,16000];

// =============================================================
// 🦋 JUMP CONFIG — tweak these to adjust how the butterfly jumps
// =============================================================
// All values are in physics units per frame (game runs at 60fps).
// Lower GRAVITY  = floatier, slower fall (more hang time)
// Higher GRAVITY = snappier, heavier feel
// JUMP_VELOCITY is NEGATIVE because Y increases downward.
// More negative = jumps higher. Less negative = lower jumps.
// STAR_BOOST_PER_STAR adds extra jump strength for each star collected.
//   Stars stack — 3 stars = JUMP_VELOCITY + (3 × STAR_BOOST_PER_STAR)
// MAX_STARS caps how high you can stack (prevents flying off-screen).
const JUMP_CONFIG = {
  GRAVITY:             0.38,   // try 0.30 (very floaty) → 0.70 (snappy)
  JUMP_VELOCITY:      -12,     // base jump strength (negative). Try -10 → -16
  STAR_BOOST_PER_STAR: -1.6,   // each star adds this much extra jump
  MAX_STARS:           5,      // cap on collected stars
};
// =============================================================

let state = 'idle';
let score = 0;
let hiScore = parseInt(localStorage.getItem('leonor_hi') || '0');
let distance = 0;
let level = 1;
let speed = 3;
let frameCount = 0;
let deathTime = 0; // timestamp when player died, used to lock out instant restart
const DEATH_LOCKOUT_MS = 600; // matches the overlay reveal delay below

const player = {
  x: 120, y: GROUND_Y, w: 100, h: 104,
  vy: 0, onGround: true,
  starsCollected: 0, // how many stars stacked
  wingFlap: 0,
};

let villains = [];
let stars = [];
let particles = [];

// Pixel-perfect collision using alpha masks.
// Fast AABB pre-check, then sample overlapping region against both masks.
function overlaps(a, aKey, b, bKey) {
  // AABB first
  if (a.x >= b.x + b.w || a.x + a.w <= b.x) return false;
  if (a.y >= b.y + b.h || a.y + a.h <= b.y) return false;

  const mA = masks[aKey], mB = masks[bKey];
  if (!mA || !mB) return false; // masks not yet built — fall through to no-collision

  // Compute the overlapping rectangle in world space
  const x1 = Math.max(a.x, b.x);
  const y1 = Math.max(a.y, b.y);
  const x2 = Math.min(a.x + a.w, b.x + b.w);
  const y2 = Math.min(a.y + a.h, b.y + b.h);

  // Step in pixels — sample every 2px for performance, still very accurate
  const step = 2;
  // Map from world coord -> source-image pixel coord (sprites may be scaled)
  const sxA = mA.w / a.w, syA = mA.h / a.h;
  const sxB = mB.w / b.w, syB = mB.h / b.h;

  for (let y = y1; y < y2; y += step) {
    for (let x = x1; x < x2; x += step) {
      const ax = ((x - a.x) * sxA) | 0;
      const ay = ((y - a.y) * syA) | 0;
      if (mA.data[ay * mA.w + ax] === 0) continue;
      const bx = ((x - b.x) * sxB) | 0;
      const by = ((y - b.y) * syB) | 0;
      if (mB.data[by * mB.w + bx] === 1) return true;
    }
  }
  return false;
}

// Cloud objects with stable pre-computed shapes
function makeCloud() {
  const r = 22 + Math.random()*16;
  return {
    x: Math.random()*W,
    y: 30 + Math.random()*70,
    r: r,
    speed: 0.2 + Math.random()*0.3,
    alpha: 0.3 + Math.random()*0.25,
    puffs: [
      { dx: 0,         dy: 0,        rs: 1.0  },
      { dx: r*0.7,     dy: -r*0.15,  rs: 0.75 },
      { dx: -r*0.8,    dy: -r*0.05,  rs: 0.7  },
      { dx: r*0.3,     dy: r*0.2,    rs: 0.65 },
      { dx: -r*0.3,    dy: r*0.25,   rs: 0.6  },
    ],
  };
}
const clouds = Array.from({length: 6}, makeCloud);

function getSpawnInterval() {
  return Math.max(70, 170 - level * 8);
}
function getStarInterval() {
  return 350 + level * 60;
}
function getVillainCount() {
  if (level >= 6 && Math.random() < 0.3) return 2;
  if (level >= 9 && Math.random() < 0.5) return 2;
  return 1;
}

let nextVillainIn = 120;
let nextStarIn = 250;

// Palette transition state — when level changes, interpolate from prev to current over time
let paletteFrom = null; // palette object we're transitioning from
let paletteProgress = 1; // 0 = paletteFrom, 1 = current level palette
const PALETTE_TRANSITION_FRAMES = 90; // ~1.5s at 60fps

function hexToRgb(h) {
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
function lerpColor(c1, c2, t) {
  const a = hexToRgb(c1), b = hexToRgb(c2);
  const r = Math.round(a[0]+(b[0]-a[0])*t);
  const g = Math.round(a[1]+(b[1]-a[1])*t);
  const bl = Math.round(a[2]+(b[2]-a[2])*t);
  return `rgb(${r},${g},${bl})`;
}
function lerpPalette(p1, p2, t) {
  return {
    top:   lerpColor(p1.top, p2.top, t),
    mid:   lerpColor(p1.mid, p2.mid, t),
    bot:   lerpColor(p1.bot, p2.bot, t),
    gT:    lerpColor(p1.gT, p2.gT, t),
    gB:    lerpColor(p1.gB, p2.gB, t),
    cloud: lerpColor(p1.cloud, p2.cloud, t),
    line:  lerpColor(p1.line, p2.line, t),
  };
}

function spawnVillain() {
  const count = getVillainCount();
  const gap = 150;
  for (let i = 0; i < count; i++) {
    // Villain rendered at 80×85. Y offset keeps its feet on the ground line:
    // butterfly height (104) minus villain height (85) = 19px lower top.
    villains.push({ x: W + i*gap, y: GROUND_Y + (104-85), w: 80, h: 85 });
  }
}
function spawnStar() {
  stars.push({ x: W + 50, y: GROUND_Y - 90 - Math.random()*30, w: 50, h: 42, bob: Math.random()*Math.PI*2 });
}

function burst(x, y, color, n=12) {
  for (let i=0; i<n; i++) {
    const angle = Math.random()*Math.PI*2;
    const spd = 1+Math.random()*4;
    particles.push({ x, y, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd-2,
      life: 1, decay: 0.04+Math.random()*0.04, r: 2+Math.random()*4, color });
  }
}

function checkLevel() {
  for (let i=9; i>=0; i--) {
    if (distance >= LEVEL_DISTANCES[i]) {
      const newLevel = i+1;
      if (newLevel !== level) {
        // Snapshot the current (possibly mid-transition) palette as the starting point
        paletteFrom = getCurrentPalette();
        paletteProgress = 0;
        level = newLevel;
        speed = 3 + (level-1)*0.55;
        sfxLevel();
        const ld = document.getElementById('level-display');
        ld.textContent = `NÍVEL ${level}`;
        ld.classList.remove('level-up');
        void ld.offsetWidth;
        ld.classList.add('level-up');
      }
      return;
    }
  }
}

function doJump() {
  if (!player.onGround) return;
  // Base jump + extra boost for each star collected (stars stack)
  const stars = Math.min(player.starsCollected, JUMP_CONFIG.MAX_STARS);
  const jumpPower = JUMP_CONFIG.JUMP_VELOCITY + stars * JUMP_CONFIG.STAR_BOOST_PER_STAR;
  player.vy = jumpPower;
  player.onGround = false;
  sfxJump();
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (state === 'idle') {
      startGame();
    } else if (state === 'dead') {
      // Ignore presses during the brief death animation window.
      // The overlay only appears after this delay, so the user knows when they can restart.
      if (Date.now() - deathTime >= DEATH_LOCKOUT_MS) startGame();
    } else {
      doJump();
    }
  }
});

document.getElementById('start-btn').addEventListener('click', () => startGame());

document.getElementById('sound-btn').addEventListener('click', () => {
  initAudio();
  soundOn = !soundOn;
  document.getElementById('sound-btn').textContent = soundOn ? '🔊' : '🔇';
  if (masterGain && audioCtx) {
    masterGain.gain.setTargetAtTime(soundOn ? 1 : 0, audioCtx.currentTime, 0.02);
  }
});

function startGame() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  stopMusic(); // ensure no leftover music from previous round
  state = 'running';
  score = 0; distance = 0; level = 1; speed = 3; frameCount = 0;
  player.y = GROUND_Y; player.vy = 0; player.onGround = true;
  player.starsCollected = 0;
  villains = []; stars = []; particles = [];
  nextVillainIn = 120; nextStarIn = 250;
  paletteFrom = null; paletteProgress = 1;
  document.getElementById('level-display').textContent = 'NÍVEL 1';
  document.getElementById('overlay').classList.add('hidden');
  startMusic();
}

function gameOver() {
  state = 'dead';
  deathTime = Date.now();
  sfxDie();
  stopMusic();
  burst(player.x + 50, player.y + 52, '#ff6b6b', 20);
  if (Math.floor(score) > hiScore) {
    hiScore = Math.floor(score);
    localStorage.setItem('leonor_hi', hiScore);
  }
  setTimeout(() => {
    // Guard: if the user already restarted (somehow), don't pop the overlay back open
    if (state !== 'dead') return;
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('overlay-title').textContent = 'Oh não!';
    document.getElementById('overlay-sub').textContent = 'A gosma apanhou-te!';
    document.getElementById('overlay-score').style.display = 'block';
    document.getElementById('final-score').textContent = Math.floor(score);
    document.getElementById('final-best').textContent = hiScore;
    document.getElementById('start-btn').textContent = 'Tentar outra vez!';
  }, DEATH_LOCKOUT_MS);
}

function drawCloud(c, palette) {
  ctx.save();
  ctx.globalAlpha = c.alpha;
  ctx.fillStyle = palette.cloud;
  c.puffs.forEach(p => {
    ctx.beginPath();
    ctx.arc(c.x + p.dx, c.y + p.dy, c.r * p.rs, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.restore();
}

function drawGround(palette) {
  const grd = ctx.createLinearGradient(0, GROUND_Y+104, 0, H);
  grd.addColorStop(0, palette.gT);
  grd.addColorStop(1, palette.gB);
  ctx.fillStyle = grd;
  ctx.fillRect(0, GROUND_Y+104, W, H-(GROUND_Y+104));
  ctx.shadowColor = palette.line;
  ctx.shadowBlur = 6;
  ctx.strokeStyle = palette.line;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y+104); ctx.lineTo(W, GROUND_Y+104);
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawBg(palette) {
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y+104);
  sky.addColorStop(0,   palette.top);
  sky.addColorStop(0.5, palette.mid);
  sky.addColorStop(1,   palette.bot);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);
}

function drawSprite(key, x, y, w, h, alpha=1) {
  if (!imgs[key] || !imgs[key].complete) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.drawImage(imgs[key], x, y, w, h);
  ctx.restore();
}

function drawPlayerStarEffect() {
  ctx.save();
  const t = Date.now()/300;
  // Glow grows with stars collected
  const intensity = Math.min(player.starsCollected, JUMP_CONFIG.MAX_STARS);
  ctx.shadowColor = '#ffe066';
  ctx.shadowBlur = 10 + intensity * 6 + Math.sin(t)*5;
  ctx.globalAlpha = 0.5 + intensity * 0.08;
  ctx.drawImage(imgs['butterfly'], player.x, player.y, player.w, player.h);
  ctx.restore();
}

// Draw small star indicators in the top-left of canvas to show stack count
function drawStarIndicators() {
  const count = Math.min(player.starsCollected, JUMP_CONFIG.MAX_STARS);
  if (count === 0) return;
  const sw = 24, sh = 20, gap = 4;
  for (let i = 0; i < count; i++) {
    const x = 12 + i * (sw + gap);
    const y = 12;
    ctx.save();
    ctx.shadowColor = '#ffe066';
    ctx.shadowBlur = 8;
    drawSprite('star', x, y, sw, sh);
    ctx.restore();
  }
}

function update() {
  if (state !== 'running') return;
  frameCount++;

  player.vy += JUMP_CONFIG.GRAVITY;
  player.y += player.vy;
  if (player.y >= GROUND_Y) {
    player.y = GROUND_Y;
    player.vy = 0;
    player.onGround = true;
  }

  // Star power persists once collected — no timer

  // Advance palette transition
  if (paletteProgress < 1) {
    paletteProgress = Math.min(1, paletteProgress + 1/PALETTE_TRANSITION_FRAMES);
  }

  player.wingFlap = (player.wingFlap + 0.25) % (Math.PI*2);

  distance += speed;
  score += speed * 0.05;
  document.getElementById('score-display').textContent = Math.floor(score);
  document.getElementById('hi-display').textContent = Math.max(hiScore, Math.floor(score));

  checkLevel();

  nextVillainIn--;
  if (nextVillainIn <= 0) {
    spawnVillain();
    nextVillainIn = getSpawnInterval() + Math.floor(Math.random()*40);
  }
  nextStarIn--;
  if (nextStarIn <= 0) {
    spawnStar();
    nextStarIn = getStarInterval() + Math.floor(Math.random()*100);
  }

  for (let i = villains.length-1; i >= 0; i--) {
    villains[i].x -= speed;
    if (villains[i].x < -100) { villains.splice(i,1); continue; }
    if (overlaps(player, 'butterfly', villains[i], 'villain')) { gameOver(); return; }
  }

  for (let i = stars.length-1; i >= 0; i--) {
    stars[i].x -= speed;
    stars[i].bob += 0.05;
    if (stars[i].x < -60) { stars.splice(i,1); continue; }
    if (overlaps(player, 'butterfly', stars[i], 'star')) {
      burst(stars[i].x+25, stars[i].y+21, '#ffe066', 16);
      stars.splice(i,1);
      if (player.starsCollected < JUMP_CONFIG.MAX_STARS) {
        player.starsCollected++;
      }
      sfxStar();
    }
  }

  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.15;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i,1);
  }

  clouds.forEach(c => {
    c.x -= c.speed;
    if (c.x < -80) {
      const fresh = makeCloud();
      Object.assign(c, fresh, { x: W+40 });
    }
  });
}

function getCurrentPalette() {
  const target = PALETTES[Math.min(level-1, 9)];
  if (paletteFrom && paletteProgress < 1) {
    // Ease in/out for smoother feel
    const t = paletteProgress;
    const eased = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;
    return lerpPalette(paletteFrom, target, eased);
  }
  return target;
}

function draw() {
  const palette = getCurrentPalette();
  ctx.clearRect(0, 0, W, H);
  drawBg(palette);
  clouds.forEach(c => drawCloud(c, palette));
  drawGround(palette);

  stars.forEach(s => {
    const bobY = Math.sin(s.bob)*5;
    ctx.save();
    ctx.shadowColor = '#ffe066';
    ctx.shadowBlur = 14;
    drawSprite('star', s.x, s.y+bobY, s.w, s.h);
    ctx.restore();
  });

  villains.forEach(v => drawSprite('villain', v.x, v.y, v.w, v.h));

  if (player.starsCollected > 0) drawPlayerStarEffect();
  const bobOffset = player.onGround ? Math.sin(player.wingFlap)*2 : 0;
  drawSprite('butterfly', player.x, player.y + bobOffset, player.w, player.h);

  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  drawStarIndicators();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.getElementById('hi-display').textContent = hiScore;
loop();
</script>
</body>
</html>
